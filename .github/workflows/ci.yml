name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Secret pattern scan
        shell: bash
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|BEGIN[[:space:]].*PRIVATE KEY|Bearer[[:space:]]+[A-Za-z0-9._-]+' -- .; then
            echo "Potential secret pattern found"
            exit 1
          fi

  gui-compile:
    name: Wails compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Wails frontend assets
        working-directory: frontend
        run: npm ci && npm run build:wails
      - name: Compile GUI package
        run: go test -tags wails ./cmd/photosheet-gui

  platform-cli:
    name: CLI build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - name: macos-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
          - name: windows-x64
            os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Build CLI and updater
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath ./cmd/photosheet
          go build -trimpath ./cmd/photosheet-updater
